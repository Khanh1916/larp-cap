<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" width="80" height="80">
  <defs>
    <!-- Royal Violet & Amethyst Gradients -->
    <linearGradient id="icon_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1433" />
      <stop offset="100%" stop-color="#0e0a1f" />
    </linearGradient>

    <linearGradient id="icon_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <linearGradient id="sm_ribbon_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sm_ribbon_t" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="sm_ribbon_l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <filter id="icon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle with Ambient Aura -->
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#icon_bg)" stroke="url(#icon_rim)" stroke-width="2" filter="url(#icon_glow)" opacity="0.45" />
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#icon_bg)" stroke="url(#icon_rim)" stroke-width="1.8" />

  <!-- Shield Shape inside -->
  <g transform="translate(8, 7)">
    <path d="M32 4.5 C46.5 4.5 56 11 56 24 C56 41.5 42 52 32 57.5 C22 52 8 41.5 8 24 C8 11 17.5 4.5 32 4.5 Z"
          fill="#130e26" stroke="url(#icon_rim)" stroke-width="1.5" />

    <!-- Open Book Base -->
    <path d="M16 41 C21 38 27 38.5 32 42.5 C37 38.5 43 38 48 41 C43 45 37 44.5 32 47.5 C27 44.5 21 45 16 41 Z"
          fill="url(#sm_ribbon_c)" opacity="0.9" />

    <!-- Monogram CTL -->
    <!-- 'C' -->
    <path d="M26 21 C19 21 16 26 16 31 C16 36.5 20 40 25 40 C27 40 28.5 39.2 29.5 38.2"
          stroke="url(#sm_ribbon_c)" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- 'T' -->
    <path d="M23 18.5 L41 18.5"
          stroke="url(#sm_ribbon_t)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M32 18.5 L32 37.5"
          stroke="url(#sm_ribbon_t)" stroke-width="3.4" stroke-linecap="round" fill="none" />

    <!-- 'L' -->
    <path d="M32 30.5 L32 37.5 C32 39 33 40 34.5 40 L44 40"
          stroke="url(#sm_ribbon_l)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Star of Excellence -->
    <polygon points="32,9 33.8,13.5 38,15.5 33.8,17.5 32,22 30.2,17.5 26,15.5 30.2,13.5"
             fill="#e9d5ff" />
  </g>
</svg>
